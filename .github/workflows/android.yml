name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p /tmp/godot_templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --headless --version
      - name: Configure Android SDK and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK not present on runner}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          keytool -genkeypair -noprompt -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Base 1 and project
        run: python3 tests/check_base1_baseline.py
      - name: Check Base 1 edits, instars, habitat, and saved individuals
        run: python3 tests/check_base1_mantis_refinement.py
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit
      - name: Verify clear plant corridor in the running scene
        run: godot --headless --path . --script res://tests/check_habitat_canopy.gd
      - name: Verify Base 1 is selected and visible
        run: godot --headless --path . --script res://tests/check_mantis_model_default.gd
      - name: Verify the modeled blue crayfish is selected and visible
        run: godot --headless --path . --script res://tests/check_blue_yabby_integration.gd
      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug Android build/LivingTerrarium3D-Base1-v1.0.0-ARM64.apk
          test -s build/LivingTerrarium3D-Base1-v1.0.0-ARM64.apk
          sha256sum build/LivingTerrarium3D-Base1-v1.0.0-ARM64.apk > build/SHA256SUMS.txt
      - name: Verify APK version 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/LivingTerrarium3D-Base1-v1.0.0-ARM64.apk | grep -F "package: name='org.livingterrarium.simulator' versionCode='84' versionName='1.0.0'"
      - name: Verify Base 1 is packaged in APK
        run: python3 tests/check_base1_apk.py build/LivingTerrarium3D-Base1-v1.0.0-ARM64.apk
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: LivingTerrarium3D-Base1-v1.0.0-ARM64-apk
          path: |
            build/LivingTerrarium3D-Base1-v1.0.0-ARM64.apk
            build/SHA256SUMS.txt
          if-no-files-found: warn
